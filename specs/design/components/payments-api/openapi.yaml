openapi: 3.0.3
info:
  title: Payments API
  version: 0.1.0
  description: Merchant accounts, payment requests, guest checkout, transactions, refunds, bank accounts and payouts.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            merchants:read: The caller's own merchant profile
            merchants:update: Update the caller's own merchant profile
            merchants:read-all: Every merchant
            payment-requests:read: The caller's own payment requests
            payment-requests:create: Create a payment request
            payment-requests:read-all: Every payment request
            transactions:read: The caller's own transactions
            transactions:read-all: Every transaction
            bank-accounts:manage: View and update the caller's own bank account
            payouts:read: The caller's own payouts
            payouts:create: Trigger a payout of the caller's own balance
            payouts:read-all: Every payout
            refunds:create: Refund one of the caller's own completed transactions
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Merchant:
      type: object
      required: [id, businessName, email, country, currency]
      properties:
        id: { type: string }
        businessName: { type: string }
        email: { type: string }
        phone: { type: string }
        country: { type: string, description: "NG, KE or ZA" }
        currency: { type: string, description: "NGN, KES or ZAR" }
        createdAt: { type: string, format: date-time }
    PaymentRequest:
      type: object
      required: [id, amount, currency, description, status]
      properties:
        id: { type: string }
        amount: { type: number }
        currency: { type: string }
        description: { type: string }
        status: { type: string, enum: [pending, paid, failed, expired] }
        linkToken: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PaymentRequestCreate:
      type: object
      required: [amount, currency, description]
      properties:
        amount: { type: number }
        currency: { type: string }
        description: { type: string }
    PaymentLinkDetails:
      type: object
      required: [merchantName, amount, currency, description, status]
      properties:
        merchantName: { type: string }
        amount: { type: number }
        currency: { type: string }
        description: { type: string }
        status: { type: string, enum: [pending, paid, failed, expired] }
    PaymentSubmission:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [mobile-money, card] }
        phoneNumber: { type: string }
        cardToken: { type: string }
    Transaction:
      type: object
      required: [id, paymentRequestId, method, amount, currency, status]
      properties:
        id: { type: string }
        paymentRequestId: { type: string }
        method: { type: string, enum: [mobile-money, card] }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, refunded] }
        providerReference: { type: string }
        paidAt: { type: string, format: date-time }
    BankAccount:
      type: object
      required: [bankName, accountNumber, accountName]
      properties:
        bankName: { type: string }
        accountNumber: { type: string }
        accountName: { type: string }
    Payout:
      type: object
      required: [id, amount, currency, status]
      properties:
        id: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [pending, settled, failed] }
        requestedAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time }
    Balance:
      type: object
      required: [available, currency]
      properties:
        available: { type: number }
        currency: { type: string }
security:
  - oauth2: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200': { description: Service is healthy }

  /me/merchant:
    get:
      operationId: getMyMerchant
      summary: The caller's own merchant profile
      security: [{ oauth2: [merchants:read] }]
      responses:
        '200':
          description: The merchant profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '404': { description: No profile yet, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      operationId: upsertMyMerchant
      summary: Create or update the caller's own merchant profile
      security: [{ oauth2: [merchants:update] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Merchant' }
      responses:
        '200':
          description: The saved profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '400':
          description: Invalid profile data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /merchants:
    get:
      operationId: listMerchants
      summary: Every merchant
      security: [{ oauth2: [merchants:read-all] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of merchants
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Merchant' } }

  /me/payment-requests:
    get:
      operationId: listMyPaymentRequests
      summary: The caller's own payment requests
      security: [{ oauth2: [payment-requests:read] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, paid, failed, expired] } }
      responses:
        '200':
          description: A page of the caller's payment requests
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/PaymentRequest' } }
    post:
      operationId: createPaymentRequest
      summary: Create a payment request
      security: [{ oauth2: [payment-requests:create] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequestCreate' }
      responses:
        '201':
          description: The created payment request, with its shareable link token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequest' }
        '400':
          description: Invalid request data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/payment-requests/{id}:
    get:
      operationId: getMyPaymentRequest
      summary: One of the caller's own payment requests
      security: [{ oauth2: [payment-requests:read] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The payment request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequest' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payment-links/{linkToken}:
    get:
      operationId: getPaymentLink
      summary: Public details of a payment request, by its link token
      security: []
      parameters:
        - { name: linkToken, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The amount, currency, merchant name and status to show the customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLinkDetails' }
        '404':
          description: No payment request for this link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payment-links/{linkToken}/pay:
    post:
      operationId: payPaymentLink
      summary: Pay a payment request as a guest, by its link token
      security: []
      parameters:
        - { name: linkToken, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentSubmission' }
      responses:
        '200':
          description: The resulting transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400':
          description: The charge failed or the link has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No payment request for this link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/transactions:
    get:
      operationId: listMyTransactions
      summary: The caller's own transactions
      security: [{ oauth2: [transactions:read] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of the caller's transactions
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }

  /transactions:
    get:
      operationId: listTransactions
      summary: Every transaction
      security: [{ oauth2: [transactions:read-all] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of every transaction
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }

  /me/transactions/{id}/refund:
    post:
      operationId: refundMyTransaction
      summary: Refund one of the caller's own completed transactions
      security: [{ oauth2: [refunds:create] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The refunded transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400':
          description: The transaction cannot be refunded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/bank-account:
    get:
      operationId: getMyBankAccount
      summary: The caller's own payout bank account
      security: [{ oauth2: [bank-accounts:manage] }]
      responses:
        '200':
          description: The bank account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccount' }
        '404':
          description: No bank account configured yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: upsertMyBankAccount
      summary: Create or update the caller's own payout bank account
      security: [{ oauth2: [bank-accounts:manage] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccount' }
      responses:
        '200':
          description: The saved bank account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccount' }
        '400':
          description: Invalid bank account data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/balance:
    get:
      operationId: getMyBalance
      summary: The caller's own available balance
      security: [{ oauth2: [payouts:read] }]
      responses:
        '200':
          description: The available balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }

  /me/payouts:
    get:
      operationId: listMyPayouts
      summary: The caller's own payout history
      security: [{ oauth2: [payouts:read] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of the caller's payouts
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Payout' } }
    post:
      operationId: createMyPayout
      summary: Trigger a payout of the caller's own available balance
      security: [{ oauth2: [payouts:create] }]
      responses:
        '201':
          description: The requested payout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '400':
          description: No bank account configured, or no available balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payouts:
    get:
      operationId: listPayouts
      summary: Every payout
      security: [{ oauth2: [payouts:read-all] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of every payout
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Payout' } }
