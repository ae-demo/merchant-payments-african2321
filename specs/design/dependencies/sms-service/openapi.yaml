openapi: 3.0.1
info:
  title: SMS Service
  description: Mock SMS delivery API. Accepts text messages for a recipient number
    and reports a delivery status. Nothing is actually sent.
  version: 0.2.0
servers:
- url: "{server}:{port}/v1"
  variables:
    server:
      default: http://localhost
    port:
      default: "8080"
paths:
  /sms:
    get:
      summary: List accepted messages.
      operationId: getSms
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsPage"
    post:
      summary: Accept a text message for delivery.
      operationId: postSms
      requestBody:
        description: Message to send
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSmsRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsMessage"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiError"
                - $ref: "#/components/schemas/ErrorPayload"
  /sms/{messageId}:
    get:
      summary: Look up a single message.
      operationId: getSmsMessageid
      parameters:
      - name: messageId
        in: path
        description: Identifier returned when the message was accepted
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsMessage"
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
components:
  schemas:
    ApiError:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: false
      description: Error payload returned for any non-2xx response.
    ErrorPayload:
      required:
      - message
      - method
      - path
      - reason
      - status
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int64
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
    SendSmsRequest:
      required:
      - body
      - to
      type: object
      properties:
        to:
          type: string
        body:
          type: string
      additionalProperties: false
      description: Request to send a text message.
    SmsMessage:
      required:
      - acceptedAt
      - messageId
      - segments
      - status
      - to
      type: object
      properties:
        messageId:
          type: string
        to:
          type: string
        status:
          $ref: "#/components/schemas/SmsStatus"
        segments:
          type: integer
          format: int64
        acceptedAt:
          type: string
        failureReason:
          type: string
      additionalProperties: false
      description: A message accepted by the service.
    SmsPage:
      required:
      - items
      - total
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SmsMessage"
        total:
          type: integer
          format: int64
      additionalProperties: false
      description: A page of accepted messages.
    SmsStatus:
      type: string
      description: Delivery state of a text message.
      enum:
      - failed
      - delivered
      - queued
